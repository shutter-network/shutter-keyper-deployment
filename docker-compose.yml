x-logging: &logging
  driver: local
  options:
    max-file: 10

x-image-main: &image-main
  image: ${SHUTTER_IMAGE_ROLLING_SHUTTER:-ghcr.io/shutter-network/keyper:v1.4.2}

x-image-metrics: &image-metrics
  image: victoriametrics/vmagent:v1.101.0

x-shutter-environment:
  &shutter-environment #- SHUTTER_INSTANCEID= - set via config script
  - SHUTTER_DATABASEURL=postgres://postgres@db:5432/keyper
  - SHUTTER_HTTP_ENABLED=${SHUTTER_HTTP_ENABLED}
  #- SHUTTER_MAXNUMKEYSPERMESSAGE= - set via config script
  #- SHUTTER_CHAIN_SYNCSTARTBLOCKNUMBER= - set via config script
  - SHUTTER_CHAIN_NODE_PRIVATEKEY=${SIGNING_KEY}
  - SHUTTER_CHAIN_NODE_ETHEREUMURL=${CHAIN_EXECUTION_RPC_WS_URL}
  #- SHUTTER_CHAIN_CONTRACTS_KEYPERSETMANAGER= - set via config script
  #- SHUTTER_CHAIN_CONTRACTS_KEYBROADCASTCONTRACT= - set via config script
  #- SHUTTER_CHAIN_CONTRACTS_SHUTTERREGISTRY= - set via config script
  #- SHUTTER_P2P_CUSTOMBOOTSTRAPADDRESSES= - set via config script
  - SHUTTER_P2P_LISTENADDRESSES=/ip4/0.0.0.0/tcp/24003,/ip4/0.0.0.0/udp/24003/quic-v1
  - SHUTTER_P2P_ADVERTISEADDRESSES=/ip4/${PUBLIC_IP}/tcp/24003,/ip4/${PUBLIC_IP}/udp/24003/quic-v1
  #- SHUTTER_P2P_DISCOVERYNAMESPACE= - set via config script
  - SHUTTER_METRICS_ENABLED=${METRICS_ENABLED}
  - SHUTTER_METRICS_PORT=9200

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./_container_scripts/keyper-db-init.sh:/docker-entrypoint-initdb.d/keyper-db-init.sh:ro
      - ./data/db-dump:/var/lib/postgresql/dump
    healthcheck:
      test: pg_isready -U postgres
      start_period: "30s"
      start_interval: "1s"
    logging: *logging

  keyper-create-config:
    <<: *image-main
    entrypoint:
      - /rolling-shutter
      - shutterservicekeyper
    environment: *shutter-environment
    volumes:
      - ./config:/config
    command: "generate-config --output /config/generated.toml --force"

  keyper-configure:
    image: busybox
    command: "./configure_keyper.sh"
    env_file:
      - path: ${CONFIG_ENV_FILE:-mainnet.env}
        required: true
    environment: *shutter-environment
    volumes:
      - ./_container_scripts/configure_keyper.sh:/configure_keyper.sh:ro
      - ./data:/data
      - ./config:/config
    depends_on:
      keyper-create-config:
        condition: service_completed_successfully

  keyper-initdb:
    <<: *image-main
    entrypoint:
      - /rolling-shutter
      - shutterservicekeyper
    environment: *shutter-environment
    volumes:
      - ./config:/config
    command: "initdb --config /config/keyper.toml"
    depends_on:
      db:
        condition: service_healthy
      keyper-configure:
        condition: service_completed_successfully

  keyper:
    <<: *image-main
    restart: always
    entrypoint:
      - /rolling-shutter
      - shutterservicekeyper
    command: "--config /config/keyper.toml"
    volumes:
      - ./config:/config
    ports:
      - "24003:24003"
      - "${METRICS_LISTEN_IP}:9200:9200"
      - "3000:3000"
    depends_on:
      keyper-initdb:
        condition: service_completed_successfully
    logging: *logging

  vmagent:
    profiles: [pushmetrics]
    <<: *image-metrics
    restart: always
    environment:
      KEYPER_NAME:
      PUSHGATEWAY_URL:
    volumes:
      - ./config_static/vmagent.yaml:/config/vmagent.yml:ro
    entrypoint:
      - "/vmagent-prod"
    command: '-promscrape.config=/config/vmagent.yml -remoteWrite.url=${PUSHGATEWAY_URL:-https://keyperingest.metrics.shutter.network/api/v1/write} -remoteWrite.basicAuth.username="${PUSHGATEWAY_USERNAME:-NOT_A_VALID_USER}" -remoteWrite.basicAuth.password="${PUSHGATEWAY_PASSWORD:-NOT_A_VALID_PASSWORD}"'
    logging: *logging
